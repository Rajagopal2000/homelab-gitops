apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-config
  labels:
    app.kubernetes.io/name: filebrowser
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.media.storageClass }}
  resources:
    requests:
      storage: {{ .Values.filebrowser.configStorageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  labels:
    app.kubernetes.io/name: filebrowser
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: filebrowser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebrowser
    spec:
      nodeSelector:
        {{- toYaml .Values.media.nodeSelector | nindent 8 }}
      containers:
        - name: filebrowser
          image: "{{ .Values.filebrowser.image.repository }}:{{ .Values.filebrowser.image.tag }}"
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: media
              mountPath: /srv
            - name: config
              mountPath: /database
          resources:
            {{- toYaml .Values.filebrowser.resources | nindent 12 }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-config
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
spec:
  selector:
    app.kubernetes.io/name: filebrowser
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`files.{{ .Values.domain }}`)
      kind: Rule
      services:
        - name: filebrowser
          port: 8080
